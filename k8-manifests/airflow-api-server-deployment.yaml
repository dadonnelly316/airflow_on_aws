apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-api-server
  labels:
    app: airflow-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-api-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: airflow-api-server
    spec:
      containers:
      - name: airflow-api-server
        command: ['build/webserver_entrypoint.sh']
        args: ['pod-template-file.yaml','__AIRFLOW_IMAGE__']
        image: __AIRFLOW_IMAGE__  # sed will edit this for easy configuration between AWS EKS and minikube
        imagePullPolicy: __IMAGE_PULL_POLICY__  # sed will edit this for easy configuration between AWS EKS and minikube
        ports:
        - containerPort: 80
        env:
        - name: AIRFLOW__CORE__EXECUTOR
          value: KubernetesExecutor
        - name: RUN_DB_MIGRATION_BOOLEAN
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: run_db_migration_boolean
        - name: AIRFLOW__WEBSERVER__BASE_URL
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: ingress_host
        - name: CREATE_WEBSERVER_USER_BOOLEAN
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: create_webserver_user_boolean
        - name: AIRFLOW_WEBSERVER_USERNAME
          valueFrom:
            secretKeyRef:
              name: airflow-api-server-username
              key: airflow-api-server-username
        - name: AIRFLOW_WEBSERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-api-server-password
              key: airflow-api-server-password
        - name: AIRFLOW_WEBSERVER_EMAIL
          valueFrom:
            secretKeyRef:
              name: airflow-api-server-email
              key: airflow-api-server-email
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: database-connection-string
              key: database-connection-string
        - name: AIRFLOW__WEBSERVER__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-api-server-secret-key
              key: airflow-api-server-secret-key
        - name: AIRFLOW__CLI__ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: airflow_cli_endpoint_url
        - name: AIRFLOW__WEBSERVER__WEB_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: airflow-config
              key: airflow_webserver_web_server_port
        # - name: AIRFLOW__CORE__FERNET_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: airflow-fernet-key
        #       key: airflow-fernet-key



 
 